<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --warning: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fb;
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .stats-card h2 {
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: var(--success);
            border-radius: 4px;
        }
        
        .task-form {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary);
        }
        
        .btn-danger {
            background-color: var(--warning);
            color: white;
        }
        
        .btn-edit {
            background-color: var(--success);
            color: white;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .task-list {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }
        
        .task-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-item:last-child {
            border-bottom: none;
        }
        
        .task-info h3 {
            margin-bottom: 5px;
        }
        
        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        .priority {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .priority-high {
            background-color: #ffebee;
            color: #d32f2f;
        }
        
        .priority-medium {
            background-color: #fff3e0;
            color: #f57c00;
        }
        
        .priority-low {
            background-color: #e8f5e9;
            color: #388e3c;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .timeline {
            position: relative;
            padding: 20px 0;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--primary);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            padding-left: 50px;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--primary);
            border: 3px solid white;
            box-shadow: 0 0 0 3px var(--primary);
        }
        
        .timeline-content {
            background: white;
            padding: 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .completed {
            text-decoration: line-through;
            opacity: 0.7;
        }
        
        .reminder {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Study Planner</h1>
            <p class="subtitle">Organize your study schedule and track academic tasks</p>
        </header>
        
        <div class="reminder" id="reminder-section">
            <h3>📢 Reminders</h3>
            <p id="reminder-text">No upcoming deadlines.</p>
        </div>
        
        <div class="dashboard">
            <div class="stats-card">
                <h2>Study Progress</h2>
                <div class="stat-item">
                    <span>Total Tasks:</span>
                    <span id="total-tasks">0</span>
                </div>
                <div class="stat-item">
                    <span>Completed:</span>
                    <span id="completed-tasks">0</span>
                </div>
                <div class="stat-item">
                    <span>Pending:</span>
                    <span id="pending-tasks">0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="stats-card">
                <h2>Upcoming Deadlines</h2>
                <div id="upcoming-deadlines">
                    <p>No upcoming deadlines.</p>
                </div>
            </div>
        </div>
        
        <div class="task-form">
            <h2>Add New Study Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Task Title</label>
                    <input type="text" id="task-title" placeholder="e.g., Complete Math Assignment" required>
                </div>
                
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" placeholder="Add details about the task..."></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="task-deadline">Deadline</label>
                        <input type="date" id="task-deadline" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="list-view">List View</div>
            <div class="tab" data-tab="timeline-view">Timeline View</div>
        </div>
        
        <div class="tab-content active" id="list-view">
            <div class="task-list" id="task-list">
                <!-- Tasks will be dynamically added here -->
            </div>
        </div>
        
        <div class="tab-content" id="timeline-view">
            <div class="timeline" id="timeline">
                <!-- Timeline items will be dynamically added here -->
            </div>
        </div>
    </div>

    <script>
        // Study Planner Application
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const taskForm = document.getElementById('task-form');
            const taskList = document.getElementById('task-list');
            const timeline = document.getElementById('timeline');
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            const reminderText = document.getElementById('reminder-text');
            
            // Statistics elements
            const totalTasksEl = document.getElementById('total-tasks');
            const completedTasksEl = document.getElementById('completed-tasks');
            const pendingTasksEl = document.getElementById('pending-tasks');
            const progressBar = document.getElementById('progress-bar');
            const upcomingDeadlinesEl = document.getElementById('upcoming-deadlines');
            
            // Initialize tasks array from local storage or empty array
            let tasks = JSON.parse(localStorage.getItem('studyTasks')) || [];
            
            // Initialize the app
            function init() {
                renderTasks();
                updateStatistics();
                checkReminders();
                setupTabs();
            }
            
            // Set up tab functionality
            function setupTabs() {
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        // Remove active class from all tabs and contents
                        tabs.forEach(t => t.classList.remove('active'));
                        tabContents.forEach(c => c.classList.remove('active'));
                        
                        // Add active class to clicked tab and corresponding content
                        tab.classList.add('active');
                        const tabId = tab.getAttribute('data-tab') + '-view';
                        document.getElementById(tabId).classList.add('active');
                        
                        // If switching to timeline view, render it
                        if (tabId === 'timeline-view') {
                            renderTimeline();
                        }
                    });
                });
            }
            
            // Add task form submission
            taskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('task-title').value;
                const description = document.getElementById('task-description').value;
                const deadline = document.getElementById('task-deadline').value;
                const priority = document.getElementById('task-priority').value;
                
                // Create task object
                const task = {
                    id: Date.now(), // Simple ID generation
                    title,
                    description,
                    deadline,
                    priority,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                // Add to tasks array
                tasks.push(task);
                
                // Save to local storage
                saveTasks();
                
                // Re-render tasks and update statistics
                renderTasks();
                updateStatistics();
                checkReminders();
                
                // Reset form
                taskForm.reset();
            });
            
            // Save tasks to local storage
            function saveTasks() {
                localStorage.setItem('studyTasks', JSON.stringify(tasks));
            }
            
            // Render tasks in list view
            function renderTasks() {
                if (tasks.length === 0) {
                    taskList.innerHTML = `
                        <div class="empty-state">
                            <i>📚</i>
                            <h3>No study tasks yet</h3>
                            <p>Add your first task to get started!</p>
                        </div>
                    `;
                    return;
                }
                
                // Sort tasks by deadline (soonest first)
                const sortedTasks = [...tasks].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
                
                taskList.innerHTML = sortedTasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <div class="task-info">
                            <h3>${task.title}</h3>
                            <p>${task.description}</p>
                            <div class="task-meta">
                                <span>Due: ${formatDate(task.deadline)}</span>
                                <span class="priority priority-${task.priority}">${task.priority.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn btn-edit" onclick="toggleTask(${task.id})">
                                ${task.completed ? 'Undo' : 'Complete'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
            
            // Render timeline view
            function renderTimeline() {
                if (tasks.length === 0) {
                    timeline.innerHTML = `
                        <div class="empty-state">
                            <i>📅</i>
                            <h3>No tasks to display</h3>
                            <p>Add tasks to see them on the timeline.</p>
                        </div>
                    `;
                    return;
                }
                
                // Sort tasks by deadline
                const sortedTasks = [...tasks].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
                
                timeline.innerHTML = sortedTasks.map(task => `
                    <div class="timeline-item">
                        <div class="timeline-content ${task.completed ? 'completed' : ''}">
                            <h3>${task.title}</h3>
                            <p>${task.description}</p>
                            <div class="task-meta">
                                <span>Due: ${formatDate(task.deadline)}</span>
                                <span class="priority priority-${task.priority}">${task.priority.toUpperCase()}</span>
                            </div>
                            <div class="task-actions" style="margin-top: 10px;">
                                <button class="btn btn-edit" onclick="toggleTask(${task.id})">
                                    ${task.completed ? 'Undo' : 'Complete'}
                                </button>
                                <button class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            // Toggle task completion status
            window.toggleTask = function(id) {
                tasks = tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                
                saveTasks();
                renderTasks();
                updateStatistics();
                
                // If we're on the timeline view, update it too
                if (document.getElementById('timeline-view').classList.contains('active')) {
                    renderTimeline();
                }
            };
            
            // Delete a task
            window.deleteTask = function(id) {
                if (confirm('Are you sure you want to delete this task?')) {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                    updateStatistics();
                    
                    // If we're on the timeline view, update it too
                    if (document.getElementById('timeline-view').classList.contains('active')) {
                        renderTimeline();
                    }
                }
            };
            
            // Update statistics
            function updateStatistics() {
                const total = tasks.length;
                const completed = tasks.filter(task => task.completed).length;
                const pending = total - completed;
                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                
                totalTasksEl.textContent = total;
                completedTasksEl.textContent = completed;
                pendingTasksEl.textContent = pending;
                progressBar.style.width = `${progress}%`;
                
                // Update upcoming deadlines
                const upcoming = tasks
                    .filter(task => !task.completed)
                    .sort((a, b) => new Date(a.deadline) - new Date(b.deadline))
                    .slice(0, 3); // Show only 3 upcoming deadlines
                
                if (upcoming.length === 0) {
                    upcomingDeadlinesEl.innerHTML = '<p>No upcoming deadlines.</p>';
                } else {
                    upcomingDeadlinesEl.innerHTML = upcoming.map(task => `
                        <div class="stat-item">
                            <span>${task.title}</span>
                            <span>${formatDate(task.deadline)}</span>
                        </div>
                    `).join('');
                }
            }
            
            // Check for reminders (tasks due within 2 days)
            function checkReminders() {
                const now = new Date();
                const twoDaysFromNow = new Date(now.getTime() + 2 * 24 * 60 * 60 * 1000);
                
                const urgentTasks = tasks.filter(task => {
                    if (task.completed) return false;
                    
                    const taskDate = new Date(task.deadline);
                    return taskDate <= twoDaysFromNow && taskDate >= now;
                });
                
                if (urgentTasks.length === 0) {
                    reminderText.textContent = 'No upcoming deadlines.';
                    document.getElementById('reminder-section').style.display = 'none';
                } else {
                    document.getElementById('reminder-section').style.display = 'block';
                    reminderText.textContent = `You have ${urgentTasks.length} task(s) due soon!`;
                }
            }
            
            // Format date for display
            function formatDate(dateString) {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString(undefined, options);
            }
            
            // Initialize the application
            init();
        });
    </script>
</body>
</html>
